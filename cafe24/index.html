<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>베프 · 카페24 연결</title><style>body{font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;background:#F8F5EC;color:#17201B;margin:0;padding:40px 16px}main{max-width:560px;margin:0 auto;background:#fff;border:1px solid #E2DCCD;border-radius:16px;padding:28px}h1{font-size:20px;margin:0 0 8px;color:#1F4A36}p{line-height:1.6;color:#4A5951}code{display:block;background:#0C1F16;color:#F8F5EC;padding:14px;border-radius:10px;word-break:break-all;font-size:13px;margin:12px 0}button{background:#1F4A36;color:#F8F5EC;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}.err{color:#C2412F}</style></head><body><main><h1>카페24 연결</h1><p id="msg">인증 코드를 확인하는 중입니다.</p><code id="cmd" hidden></code><button id="copy" hidden>명령 복사</button><p id="note" hidden>이 코드는 몇 분 뒤 만료됩니다. 바로 터미널에서 실행해 주세요. 이 페이지는 코드를 저장하거나 어디에도 보내지 않습니다.</p></main><script>var q=new URLSearchParams(location.search),c=q.get('code'),e=q.get('error'),m=document.getElementById('msg');if(c){m.textContent='허용을 마쳤습니다. 아래 명령을 복사해 터미널에서 실행하면 연결이 끝납니다.';var k=document.getElementById('cmd');k.textContent='python3 ~/.bf-cafe24/sync.py exchange '+c;k.hidden=false;var b=document.getElementById('copy');b.hidden=false;document.getElementById('note').hidden=false;b.onclick=function(){navigator.clipboard.writeText(k.textContent).then(function(){b.textContent='복사했습니다'})}}else{m.className='err';m.textContent=e?('연결하지 못했습니다: '+e+' '+(q.get('error_description')||'')):'인증 코드가 없습니다. auth-url 주소를 다시 열어 허용해 주세요.'}</script></body></html>
